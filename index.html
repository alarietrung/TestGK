, {"id": "8-1", "unit": 8, "q": "That <u>company that provides access to the Internet<\/u> has very good service.", "options": ["ISP", "email address", "username", "SMTP server"], "answer": "ISP", "explain": "ISP là nhà cung cấp dịch vụ truy cập Internet.", "term": "ISP", "vi": "nhà cung cấp Internet", "extras": ["POP3", "email client"]}, {"id": "8-2", "unit": 8, "q": "I use an <u>email service available on web browsers<\/u>, so my emails are not saved on my computer.", "options": ["POP3", "webmail", "ISP", "attachment"], "answer": "webmail", "explain": "Webmail được dùng qua trình duyệt web.", "term": "Webmail", "vi": "email trên trình duyệt", "extras": ["SMTP server", "password"]}, {"id": "8-3", "unit": 8, "q": "Enter your <u>code that identifies you on a computer<\/u> and press “enter”.", "options": ["username", "webmail", "POP3", "domain name"], "answer": "username", "explain": "Username là tên định danh người dùng.", "term": "Username", "vi": "tên người dùng", "extras": ["email address", "attachment"]}, {"id": "8-4", "unit": 8, "q": "Most people use a <u>method to receive emails from a server<\/u> to get their email.", "options": ["email address", "POP3", "webmail", "SMTP"], "answer": "POP3", "explain": "POP3 là giao thức nhận email từ máy chủ.", "term": "POP3", "vi": "giao thức nhận email", "extras": ["ISP", "username"]}], "writing": {"1": {"title": "Chuyển bộ phận", "roles": "A: người quản lý. B: nhân viên.", "cues": ["Hỏi nhân viên hiện đang ở bộ phận nào.", "Hỏi nhân viên muốn chuyển sang bộ phận nào.", "Hỏi lý do, đặc biệt là kinh nghiệm phù hợp.", "Nhân viên trả lời và nêu tên người quản lý."], "checks": [["current", "quality assurance|current section|section"], ["desired", "information security|transfer|move"], ["reason", "experience|more valuable|skills"], ["supervisor", "hopkins|mr.|supervisor"]], "sample": [["Employee", "Excuse me, Mr. Hopkins? I have a question about the restructuring."], ["Hopkins", "Please, come in. What’s your question?"], ["Emplo "mr.", "mrs.", "ms."], ["supervisor", "employee", "a:", "b:", "which section", "why do"]]}]}, "2": {"title": "Máy tính công ty", "roles": "A: nhân viên mới. B: chuyên viên IT.", "cues": ["Hỏi công ty có những loại máy tính nào.", "Hỏi máy để bàn, laptop và workstation ở đâu.", "Hỏi cách truy cập hoặc đặt workstation.", "Chuyên viên IT trả lời đủ cả ba ý."], "checks": [["computers", "desktop|laptop|workstation"], ["locations", "office|it department|next door"], ["access", "server|log on|reserve"], ["roles", "employee|professional|a:|b:"]], "sample": [["IT Professional", "Here’s your new office. Jon works in here, too."], ["New Employee", "So, everyone has their own desktop computers. Do we have laptops?"], ["IT Professional", "Yes. That’s your computer there. Laptops are in the IT department."], ["New Employee", "Okay, but I also need a workstation."], ["IT Professional", "Right, you work on some powerful programs. Those are next door."], ["New Employee", "Do I sign up to use them? I mean, how do I get access to one?"], ["IT Professional", "Just log on to the server. All computers connect to it. Then, click “reserve workstation”."], ["New Employee", "Thanks!"]], "scriptVi": ["Giới thiệu văn phòng mới; Jon cũng làm việc ở đây.", "Hỏi có laptop không sau khi nhắc đến desktop.", "Chỉ máy của nhân viên; laptop ở IT department.", "Nói mình cần workstation.", "Workstation ở phòng bên cạnh vì dùng chương trình mạnh.", "Hỏi có phải đăng ký không và cách truy cập.", "Đăng nhập server, rồi bấm reserve workstation.", "Cảm ơn."], "model": [["New Employee", "What computers do we have here?", "Hỏi các loại máy tính."], ["IT Professional", "We have desktop computers, laptops, and workstations.", "Liệt kê ba loại máy."], ["New Employee", "Where are the desktop computers and laptops?", "Hỏi vị trí desktop và laptop."], ["IT Professional", "Every employee has a desktop computer in their office. Laptops are in the IT department.", "Desktop ở văn phòng; laptop ở bộ phận IT."], ["New Employee", "Okay, but I also need a workstation. Where are they?", "Nói cần workstation và hỏi vị trí."], ["IT Professional", "They are next door. You can use them for powerful programs.", "Workstation ở phòng bên cạnh."], ["New Employee", "How do I get access to one?", "Hỏi cách truy cập."], ["IT Professional", "Just log on to the server. All computers connect to it. Then click “reserve workstation”.", "Đăng nhập server rồi đặt workstation."], ["New Employee", "Thanks for your help.", "Cảm ơn."]], "rubric": [{"label": "Loại máy: desktop, laptop, workstation", "groups": [["desktop"], ["laptop"], ["workstation"]]}, {"label": "Vị trí: office, IT department, next door", "groups": [["office"], ["it department"], ["next door"]]}, {"label": "Cách dùng: log on to server → reserve workstation", "groups": [["log on", "log in", "login"], ["server"], ["reserve", "book"]]}, {"label": "Thể hiện cả nhân viên mới và chuyên viên IT", "groups": [["employee", "a:", "what computers", "where are"], ["professional", "b:", "we have", "they are"]]}]}}, "paragraphs": ["A computer’s OS runs the device, supports its applications, and defines how users can interact with it. It is the software base of the computing device upon which everything builds. There can be two kinds of interfaces in Operating system used today, one is GUI (graphical user interface ) and the other is CLI(Command Line interface). A GUI displays pictures on a monitor, and the user interacts with the pictures by moving a mouse and that’s why they are popular because they are easy to use. Users interact with a CLI by typing commands at a text-based on-screen command window.", "There can be several kinds of Operating systems(OS) for PCs but some of the famous OS are as below.", "Windows OS by Microsoft and they have several versions available and these are basically GUI and users can use it in CLI as well. For example Win7,Win 10 etc.", "Apple MacOS by Apple which was formerly known by OS-X before 2016 in the market", "Linux OS is a free, open source operating system which means that anyone can download and modify the source code. For example Ubuntu14.04, Ubuntu16.04 etc. Linux OS uses both GUI and CLI but mostly CLI."], "chunks": [{"id": "r1", "title": "OS làm gì?", "text": "A computer’s OS runs the device, supports its applications, and defines how users can interact with it.", "vi": "OS vận hành thiết bị, hỗ trợ ứng dụng và quy định cách người dùng tương tác."}, {"id": "r2", "title": "Nền tảng phần mềm", "text": "It is the software base of the computing device upon which everything builds.", "vi": "OS là nền tảng phần mềm của thiết bị, mọi thành phần khác xây dựng trên đó."}, {"id": "r3", "title": "Hai giao diện", "text": "There can be two kinds of interfaces in Operating system used today, one is GUI (graphical user interface ) and the other is CLI(Command Line interface).", "vi": "Hai loại giao diện: GUI (giao diện đồ họa) và CLI (giao diện dòng lệnh)."}, {"id": "r4", "title": "GUI và chuột", "text": "A GUI displays pictures on a monitor, and the user interacts with the pictures by moving a mouse and that’s why they are popular because they are easy to use.", "vi": "GUI hiển thị hình ảnh; người dùng tương tác bằng chuột. GUI phổ biến vì dễ dùng."}, {"id": "r5", "title": "CLI và câu lệnh", "text": "Users interact with a CLI by typing commands at a text-based on-screen command window.", "vi": "Với CLI, người dùng gõ lệnh trong cửa sổ lệnh trên màn hình."}, {"id": "r6", "title": "Các hệ điều hành", "text": "There can be several kinds of Operating systems(OS) for PCs but some of the famous OS are as below.", "vi": "Có nhiều hệ điều hành cho PC; đoạn tiếp theo nêu một số hệ điều hành nổi tiếng."}, {"id": "r7", "title": "Windows", "text": "Windows OS by Microsoft and they have several versions available and these are basically GUI and users can use it in CLI as well.", "vi": "Windows của Microsoft có nhiều phiên bản; chủ yếu dùng GUI và cũng dùng được CLI."}, {"id": "r8", "title": "Ví dụ Windows", "text": "For example Win7,Win 10 etc.", "vi": "Ví dụ trong đề cương: Win7, Win 10."}, {"id": "r9", "title": "macOS", "text": "Apple MacOS by Apple which was formerly known by OS-X before 2016 in the market", "vi": "macOS của Apple trước năm 2016 được gọi là OS-X theo cách viết trong đề cương."}, {"id": "r10", "title": "Linux và mã nguồn mở", "text": "Linux OS is a free, open source operating system which means that anyone can download and modify the source code.", "vi": "Linux miễn phí, mã nguồn mở: ai cũng có thể tải xuống và sửa mã nguồn."}, {"id": "r11", "title": "Ví dụ Linux", "text": "For example Ubuntu14.04, Ubuntu16.04 etc.", "vi": "Ví dụ trong đề cương: Ubuntu14.04, Ubuntu16.04."}, {"id": "r12", "title": "Giao diện của Linux", "text": "Linux OS uses both GUI and CLI but mostly CLI.", "vi": "Đoạn đề cương nói Linux dùng cả GUI và CLI, nhưng chủ yếu CLI."}]}</script>
<script>(()=>{'use strict';
const DATA=JSON.parse(document.getElementById('contentData').textContent);
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const KEY='it-sprint-v2';
const paths={home:'M3 10l9-7 9 7v10H3z M9 20v-7h6v7',quiz:'M5 3h14v18H5z M8 7h8 M8 12h8 M8 17h4',reading:'M3 4h7l2 2 2-2h7v15h-7l-2 2-2-2H3z M12 6v15',writing:'M4 20l4-1 12-12-4-4L4 15z M14 5l4 4',exam:'M9 3h6 M12 3v3 M20 13a8 8 0 1 1-16 0 8 8 0 0 1 16 0z M12 9v5l3 2',progress:'M4 20h16 M7 16V9 M12 16V4 M17 16v-5',sun:'M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8 M12 2v2 M12 20v2 M2 12h2 M20 12h2 M5 5l1.5 1.5 M17.5 17.5L19 19 M5 19l1.5-1.5 M17.5 6.5L19 5',moon:'M20 14a8 8 0 0 1-10-10A9 9 0 1 0 20 14z',sound:'M3 9h4l5-4v14l-5-4H3z M16 8c3 2 3 6 0 8 M19 5c6 4 6 10 0 14',check:'M5 12l4 4L20 5',pause:'M8 5v14 M16 5v14',play:'M7 4l14 8-14 8z',close:'M6 6l12 12 M18 6L6 18',download:'M12 3v12 M7 10l5 5 5-5 M4 17v4h16v-4',refresh:'M20 9a8 8 0 1 0-1 9 M20 3v6h-6',star:'M12 3l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z',info:'M12 8v1 M12 12v5 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z'};
function icon(n){return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[n]||paths.info}"/></svg>`}
const defaultDB=()=>({version:2,items:{},mistakes:{},drafts:{},daily:{},sessions:[],prefs:{theme:'system',plan:60},exam:null,focus:null});
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.version===2&&x.items&&x.prefs)return {...defaultDB(),...x};const d=defaultDB();for(const u of [1,2]){const v=JSON.parse(localStorage.getItem('it-sprint-draft-'+u));if(typeof v==='string')d.drafts['w-'+u+'-model']=v}const t=JSON.parse(localStorage.getItem('it-sprint-theme'));if(t==='dark'||t==='light')d.prefs.theme=t;const missed=JSON.parse(localStorage.getItem('it-sprint-missed')||'[]');if(Array.isArray(missed))for(const id of missed)d.items['q'+id]={attempts:1,correct:0,streak:0,lastCorrect:false};return d}catch{return defaultDB()}}
let db=load(),storageWarned=false,toastTimer,confirmCallback;
let S={route:'home',quiz:{filter:'all',mode:'choice',reverse:false,list:[],index:0,done:false,selected:null,correct:0,flipped:false,assisted:false,checked:false},reading:{mode:'learn',chunk:0,scope:'all',level:.3,hints:false,cloze:null},writing:{unit:1,source:'model',mode:'learn',line:0,assisted:false,checked:false},recall:{checked:false,assisted:false},examReport:false};
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{if(!storageWarned){storageWarned=true;toast('Trình duyệt chưa cho lưu tiến độ. Bạn vẫn có thể ôn trong phiên này.')}}}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),4200)}
function dateKey(){return new Date().toLocaleDateString('sv-SE')}
function record(id,correct,kind,{assisted=false,question='',answer='',typed=''}={}){if(assisted)return;let item=db.items[id]||{attempts:0,correct:0,streak:0};item.attempts++;if(correct)item.correct++;item.streak=correct?item.streak+1:0;item.lastCorrect=correct;item.last=Date.now();item.kind=kind;db.items[id]=item;db.daily[dateKey()]=(db.daily[dateKey()]||0)+1;if(!correct&&question)db.mistakes[id]={id,kind,question,answer,typed,last:Date.now()};else if(correct)delete db.mistakes[id];save()}
function session(type,label,correct,total,extra=''){db.sessions.unshift({type,label,correct,total,extra,time:Date.now()});db.sessions=db.sessions.slice(0,60);save()}
function mastery(prefix,ids){return ids.filter(id=>(db.items[prefix+id]?.streak||0)>=2).length}
function badgeFor(id){const i=db.items[id];return i?.streak>=2?'<span class="badge good">Tự nhớ đúng ≥ 2 lần</span>':i?.attempts?'<span class="badge gray">Đang luyện</span>':'<span class="badge gray">Chưa kiểm tra</span>'}
function words(text){const result=[],rx=/[A-Za-z0-9]+(?:[’'\-][A-Za-z0-9]+)*(?:\.[A-Za-z0-9]+)*/g;let m;while((m=rx.exec(text)))result.push({text:m[0],start:m.index,end:rx.lastIndex});return result}
function norm(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9]/g,'')}
function tokens(text,stripRoles=false){if(stripRoles)text=text.replace(/^[^:\n]{1,35}:\s*/gm,'');return words(text).map(t=>({raw:t.text,key:norm(t.text)}))}
function compare(expected,actual,stripRoles=false){const a=tokens(expected,stripRoles),b=tokens(actual,stripRoles);if(b.length>1200)return null;const rows=Array.from({length:a.length+1},()=>new Uint16Array(b.length+1));for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)rows[i][j]=a[i].key===b[j].key?rows[i+1][j+1]+1:Math.max(rows[i+1][j],rows[i][j+1]);let i=0,j=0,out=[],same=0;while(i<a.length||j<b.length){if(i<a.length&&j<b.length&&a[i].key===b[j].key){out.push({type:'same',text:a[i].raw});i++;j++;same++}else if(j<b.length&&(i===a.length||rows[i][j+1]>rows[i+1][j])){out.push({type:'extra',text:b[j++].raw})}else out.push({type:'missing',text:a[i++].raw})}return {same,total:a.length,missing:a.length-same,extra:out.filter(x=>x.type==='extra').length,percent:a.length?Math.round(same/a.length*100):0,out}}
function diffHTML(d){return `<div class="score-line"><strong>${d.percent}% từ đúng</strong><span class="small muted">${d.same}/${d.total} từ mẫu · thiếu ${d.missing} · thừa ${d.extra}</span></div><div class="legend"><span class="red">Gạch đỏ: từ còn thiếu / cần sửa</span><span>Từ gạch ngang: từ thừa</span></div><div class="diff">${d.out.map(t=>`<span class="${t.type}">${esc(t.text)}</span>`).join(' ')}</div><p class="micro muted spacer">So khớp theo thứ tự từ, bỏ qua hoa/thường và dấu câu. Đây là công cụ học thuộc, không chấm ngữ pháp.</p>`}
function setTheme(){const t=db.prefs.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):db.prefs.theme;document.documentElement.dataset.theme=t;$('#themeBtn').innerHTML=icon(t==='dark'?'sun':'moon')+`<span>${t==='dark'?'Sáng':'Tối'}</span>`;document.querySelector('meta[name=theme-color]').content=t==='dark'?'#0d1728':'#f4f8ff'}
setTheme();
const routes=[['home','Hôm nay','home'],['quiz','Bài 4 · Từ vựng','quiz'],['reading','Reading','reading'],['writing','Writing','writing'],['exam','Thi thử','exam'],['progress','Tiến độ','progress']];
function renderNav(){$('#navigation').innerHTML=routes.map(([id,label,ic])=>`<button class="nav-button ${S.route===id?'active':''}" data-action="route" data-value="${id}" ${S.route===id?'aria-current="page"':''}>${icon(ic)}<span>${label}</span></button>`).join('')}
function route(id){if(!routes.some(r=>r[0]===id))return;S.route=id;try{history.replaceState(null,'','#'+id)}catch{}if('speechSynthesis'in window)speechSynthesis.cancel();render();window.scrollTo({top:0,behavior:'instant'});$('#navigation .active')?.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'})}
function head(eyebrow,title,sub,badge=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${sub}</p></div>${badge?`<span class="badge">${badge}</span>`:''}</div>`}

function makeCloze(text,level,weak=false){const ts=words(text),count=Math.max(1,Math.round(ts.length*level));let chosen=shuffle(ts.map((_,i)=>i));if(weak){const missed=new Set(Object.values(db.mistakes).filter(m=>m.kind==='reading').map(m=>norm(m.answer)));chosen.sort((a,b)=>Number(missed.has(norm(ts[b].text)))-Number(missed.has(norm(ts[a].text))))}return {text,tokens:ts,blanks:chosen.slice(0,count).sort((a,b)=>a-b),answers:{},checked:false,assisted:false,saved:false,revealed:false,wrong:[]}}
function clozeHTML(c,prefix,report=false){let pos=0,out='';c.tokens.forEach((t,i)=>{if(!c.blanks.includes(i))return;out+=esc(c.text.slice(pos,t.start));const typed=c.answers[i]||'',right=norm(typed)===norm(t.text);out+=report?`<span class="${right?'good-text':'bad-text'}" style="text-decoration:${right?'none':'underline'}">${esc(t.text)}</span>`:`<input class="blank ${c.revealed?'revealed':c.checked?(right?'good':'bad'):''}" style="width:${Math.min(185,Math.max(56,t.text.length*8+22))}px" aria-label="Từ còn thiếu ${c.blanks.indexOf(i)+1}" data-cloze="${prefix}" data-index="${i}" value="${esc(typed)}" autocomplete="off" autocapitalize="off" spellcheck="false">${c.checked&&!right?`<span class="inline-correction">${esc(t.text)}</span>`:''}`;pos=t.end});out+=esc(c.text.slice(pos));return '<div class="reading-content">'+out.split('\n\n').map(p=>`<p>${p}</p>`).join('')+'</div>'}

function updateExamClock(){const e=db.exam;if(!e||e.submitted)return;const left=e.deadline-Date.now();if(left<=0){finishExam(true);return}const el=$('#examClock');if(el){el.textContent=formatTime(left);el.classList.toggle('urgent',left<120000)}}
function renderProgress(){const st=stats(),wrong=Object.values(db.mistakes).sort((a,b)=>b.last-a.last),max=Math.max(1,...Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return db.daily[d.toLocaleDateString('sv-SE')]||0}));return head('TIẾN ĐỘ · DỮ LIỆU TRÊN THIẾT BỊ','Biết mình đang nhớ phần nào.','Chỉ kết quả tự trả lời không dùng gợi ý mới được ghi nhận. “Nhớ chắc” là hai lần đúng liên tiếp; đây là chỉ báo ôn tập.','Lưu cục bộ')+`<div class="stat-grid"><div class="stat"><span>Bài 4 nhớ chắc</span><strong>${st.q}<em>/ 10</em></strong></div><div class="stat"><span>Reading nhớ chắc</span><strong>${st.r}<em>/ ${st.rn}</em></strong></div><div class="stat"><span>Writing mẫu Bài 8</span><strong>${st.w}<em>/ ${st.wn}</em></strong></div><div class="stat"><span>Cần sửa lại</span><strong>${st.mistakes}</strong></div></div><div class="dashboard"><div class="panel"><h2>Hoạt động 7 ngày</h2><p class="micro muted">Số lượt tự trả lời được ghi nhận mỗi ngày.</p><div class="chart-bars">${Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const key=d.toLocaleDateString('sv-SE'),n=db.daily[key]||0;return `<div class="chart-bar" aria-label="${key}: ${n} lượt"><span style="height:${Math.max(2,n/max*75)}px" title="${n} lượt"></span><small>${d.getDate()}/${d.getMonth()+1}</small></div>`}).join('')}</div></div><div class="panel"><h2>Giữ lại tiến độ</h2><p class="small muted spacer">Xuất bản sao để chuyển máy hoặc giữ lại trước khi xóa dữ liệu trình duyệt. Bản sao có cả bài viết nháp.</p><div class="row spacer"><button class="btn soft" data-action="export">${icon('download')}Xuất tiến độ</button><button class="btn" data-action="import">Nhập bản sao</button></div><button class="btn sm text danger spacer" data-action="reset">Xóa tiến độ ôn</button></div></div><div class="panel large-space"><h2>Bài 4 · mức nhớ từng câu</h2>${DATA.quiz.map(q=>{const i=db.items['q'+q.id];return `<div class="history-row"><div><strong>${q.term}</strong><p>Unit ${q.unit} · ${q.vi}</p></div><div>${badgeFor('q'+q.id)}<p style="text-align:right">${i?`${i.correct}/${i.attempts} lần đúng · chuỗi ${i.streak}`:'Chưa luyện'}</p></div></div>`}).join('')}</div><div class="panel"><div class="panel-head"><h2>Sổ lỗi cần ôn lại</h2><span class="badge gray">${wrong.length} mục</span></div>${wrong.length?wrong.slice(0,35).map(m=>`<div class="report-item"><span class="badge gray">${({quiz:'Bài 4',reading:'Reading',writing:'Writing'})[m.kind]||'Ôn tập'}</span><p><strong>${esc(m.question)}</strong></p><p class="small good-text">Cần nhớ: ${esc(m.answer)}</p>${m.typed?`<p class="small muted">Đã gõ: ${esc(m.typed)}</p>`:''}<button class="btn sm text" data-action="mistake-study" data-value="${esc(m.id)}">Luyện lại</button></div>`).join(''):'<p class="empty">Chưa có lỗi cần sửa. Hãy thử một lượt không xem gợi ý.</p>'}</div><div class="panel"><h2>Lịch sử gần đây</h2>${db.sessions.length?db.sessions.slice(0,12).map(s=>`<div class="history-row"><div><strong>${esc(s.label)}</strong><p>${new Date(s.time).toLocaleString('vi-VN')} · ${esc(s.extra)}</p></div><span class="badge">${s.correct}/${s.total}</span></div>`).join(''):'<p class="empty">Kết quả sẽ xuất hiện sau lượt luyện đầu tiên.</p>'}</div>`}
function confirmAction(title,text,fn,label='Tiếp tục'){confirmCallback=fn;$('#dialogBody').innerHTML=`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="row"><button class="btn" data-action="dialog-close">Hủy</button><button class="btn primary" data-action="dialog-confirm">${esc(label)}</button></div>`;$('#dialog').showModal()}
function updateFocus(){const e=db.exam,f=db.focus;let html='';if(e&&!e.submitted)html=`<button class="btn sm soft" data-action="route" data-value="exam">${icon('exam')}<span id="headerExamClock">${formatTime(e.deadline-Date.now())}</span></button>`;else if(f){const left=f.paused?f.remaining:f.deadline-Date.now();html=`<div class="timer-pill">${icon('exam')}<span class="timer-label">Tập trung</span><span id="focusClock">${formatTime(left)}</span><button data-action="focus-toggle" aria-label="${f.paused?'Tiếp tục đồng hồ':'Tạm dừng đồng hồ'}">${icon(f.paused?'play':'pause')}</button><button data-action="focus-stop" aria-label="Dừng đồng hồ">${icon('close')}</button></div>`}$('#focusDock').innerHTML=html}
function tick(){if(db.exam&&!db.exam.submitted){updateExamClock();const c=$('#headerExamClock');if(c)c.textContent=formatTime(db.exam.deadline-Date.now());return}const f=db.focus;if(!f||f.paused)return;const left=f.deadline-Date.now(),el=$('#focusClock');if(el)el.textContent=formatTime(left);if(left<=0){db.focus=null;save();updateFocus();toast('Đã hết lượt tập trung. Nghỉ một chút rồi ôn lại phần còn yếu.')}}
function prepareRecall(){S.recall={checked:false,assisted:false}}
function prepareLine(){S.writing.checked=false;S.writing.assisted=false}
function exportData(){const blob=new Blob([JSON.stringify({app:'IT English Sprint',exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='it-english-tien-do-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Đã xuất bản sao tiến độ và bài viết nháp.')}
const actions={
 route:b=>route(b.dataset.value),theme:()=>{db.prefs.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();setTheme()},
 continue:b=>{if(b.dataset.value==='quiz'){S.quiz.filter=quizPool().some(q=>db.items['q'+q.id]?.lastCorrect===false)?'weak':'all';newQuiz()}if(b.dataset.value==='reading'){S.reading.mode='cloze';S.reading.scope='all';resetCloze(true)}route(b.dataset.value)},
 'focus-stage':b=>{db.focus={deadline:Date.now()+Number(b.dataset.minutes)*60000,paused:false,label:b.dataset.value};save();route(b.dataset.value)},
 'focus-toggle':()=>{const f=db.focus;if(!f)return;if(f.paused){f.deadline=Date.now()+f.remaining;f.paused=false}else{f.remaining=Math.max(0,f.deadline-Date.now());f.paused=true}save();updateFocus()},'focus-stop':()=>{db.focus=null;save();updateFocus()},
 'quiz-filter':b=>{S.quiz.filter=b.dataset.value;newQuiz();render()},'quiz-mode':b=>{S.quiz.mode=b.dataset.value;newQuiz();render()},'quiz-new':()=>{newQuiz();render()},
 'quiz-answer':b=>answerQuiz(S.quiz.list[S.quiz.index].options[Number(b.dataset.value)]),
 'quiz-type':()=>{const v=$('#quizTyped').value;if(!v.trim()){toast('Hãy gõ một thuật ngữ trước.');return}answerQuiz(v)},'quiz-next':nextQuiz,
 'quiz-hint':()=>{S.quiz.assisted=true;render()},'card-flip':()=>{S.quiz.flipped=!S.quiz.flipped;render()},
 'card-again':()=>{const q=S.quiz.list[S.quiz.index];db.mistakes['q'+q.id]={id:'q'+q.id,kind:'quiz',question:q.term+' · '+q.vi,answer:q.answer,typed:'',last:Date.now()};save();toast('Đã thêm vào sổ lỗi cần ôn.');nextQuiz()},
 'speak-term':()=>speak(S.quiz.list[S.quiz.index].term),
 'reading-mode':b=>{S.reading.mode=b.dataset.value;if(S.reading.mode==='cloze')resetCloze();prepareRecall();render()},'reading-new':()=>{resetCloze();render()},'reading-weak':()=>{resetCloze(true);render();toast('Đã ưu tiên các từ từng điền sai, nếu có.')},
 'reading-all-recall':()=>{S.reading.scope='all';S.reading.mode='recall';prepareRecall();render()},
 'reading-recall-chunk':b=>{S.reading.scope=b.dataset.value;S.reading.mode='recall';prepareRecall();render()},
 'reading-next-chunk':()=>{S.reading.scope=String((Number(S.reading.scope)+1)%DATA.chunks.length);prepareRecall();render()},
 'reading-compare':compareReading,'reading-initials':()=>{S.recall.assisted=true;$('#readingRecallFeedback').innerHTML='<div class="hint spacer"><p class="small muted">Gợi ý · lượt này có hỗ trợ</p><p class="mnemonic">'+esc(initials(readingExpected()))+'</p></div>'},
 'reading-reveal':()=>{S.recall.assisted=true;$('#readingRecallFeedback').innerHTML='<div class="hint spacer"><p class="small muted">Đoạn gốc · lượt này có hỗ trợ</p><p>'+esc(readingExpected())+'</p></div>'},
 'cloze-check':checkCloze,'cloze-hint':()=>{const c=S.reading.cloze;c.assisted=true;c.hints=true;render();$$('[data-cloze=reading]').forEach(i=>i.placeholder=c.tokens[Number(i.dataset.index)].text[0]+'…');toast('Đã gợi ý chữ đầu. Lượt này không tính kết quả tự nhớ.')},
 'cloze-reveal':()=>{const c=S.reading.cloze;c.assisted=true;c.revealed=true;c.checked=false;c.blanks.forEach(i=>c.answers[i]=c.tokens[i].text);render();toast('Hãy đọc lại đáp án rồi đổi vị trí lỗ để tự kiểm tra.')},
 'cloze-retry':()=>{const c=S.reading.cloze;c.wrong.forEach(i=>c.answers[i]='');c.checked=false;c.assisted=true;c.revealed=false;render();toast('Đã che lại ô sai. Lượt sửa lỗi không tính thành lượt mới.')},
 'speak-chunk':b=>speak(DATA.chunks[Number(b.dataset.value)].text),
 'writing-unit':b=>{S.writing.unit=Number(b.dataset.value);S.writing.line=0;prepareLine();render()},'writing-mode':b=>{S.writing.mode=b.dataset.value;prepareLine();render()},
 'writing-line':b=>{S.writing.mode='line';S.writing.line=Number(b.dataset.value);prepareLine();render()},'writing-next':()=>{S.writing.line=(S.writing.line+1)%writingLines().length;prepareLine();render()},
 'writing-compare-line':compareLine,'writing-hint':()=>{S.writing.assisted=true;$('#writingLineFeedback').innerHTML='<div class="hint spacer"><p class="small muted">Gợi ý · lượt này có hỗ trợ</p><p class="mnemonic">'+esc(initials(writingLines()[S.writing.line][1]))+'</p></div>'},
 'writing-reveal':()=>{S.writing.assisted=true;$('#writingLineFeedback').innerHTML='<div class="hint spacer">'+esc(writingLines()[S.writing.line][1])+'</div>'},
 'writing-check':()=>{const v=$('#writingFull').value;if(!v.trim()){toast('Hãy viết bài trước khi rà ý.');return}$('#writingFullFeedback').innerHTML='<div class="feedback"><h3>Tự rà 4 nhóm ý</h3>'+rubricHTML(v,S.writing.unit)+'</div>'},
 'writing-compare-full':()=>{const v=$('#writingFull').value;if(!v.trim()){toast('Hãy viết bài trước khi so mẫu.');return}const d=compare(writingLines().map(([r,l])=>r+': '+l).join('\n'),v,true);if(d)$('#writingFullFeedback').innerHTML='<div class="feedback">'+diffHTML(d)+'</div>'},
 'writing-full-sample':()=>{$('#writingFullFeedback').innerHTML='<div class="hint spacer">'+writingLines().map(([r,l])=>'<p><strong>'+esc(r)+':</strong> '+esc(l)+'</p>').join('')+'</div>'},
 'writing-clear':()=>confirmAction('Xóa bản nháp này?','Bản nháp của unit và mẫu đang chọn sẽ được xóa.',()=>{db.drafts[writingDraftKey()]='';save();render()},'Xóa bản nháp'),
 'speak-dialog':()=>speak(writingLines().map(([r,l])=>l).join(' ')),
 'exam-start':startExam,'exam-submit':()=>{const e=db.exam,all=10+e.reading.blanks.length+1;confirmAction('Nộp bài thi thử?',`Đã điền ${examFilled(e)}/${all} mục. Nộp bài để xem đáp án và kết quả.`,()=>finishExam(false),'Nộp bài')},
 'exam-new':()=>{db.exam=null;save();render()},'exam-to-writing':()=>{S.writing.unit=db.exam.unit;S.writing.mode='free';S.writing.source='model';route('writing')},
 'mistake-study':b=>{const id=b.dataset.value,m=db.mistakes[id];if(!m)return;if(m.kind==='quiz'){S.quiz.filter='all';newQuiz();S.quiz.index=Math.max(0,S.quiz.list.findIndex(q=>'q'+q.id===id));route('quiz')}else if(m.kind==='reading'){if(/^r\d+$/.test(id)){S.reading.mode='recall';S.reading.scope=String(DATA.chunks.findIndex(c=>c.id===id));prepareRecall()}else{S.reading.mode='cloze';S.reading.scope='all';resetCloze(true)}route('reading')}else{const p=id.match(/^w([12])-(model|script)-(\d+)$/);if(p){S.writing.unit=Number(p[1]);S.writing.source=p[2];S.writing.line=Number(p[3]);S.writing.mode='line';prepareLine()}route('writing')}},
 export:exportData,import:()=>$('#importFile').click(),reset:()=>confirmAction('Xóa tiến độ ôn trên máy này?','Tiến độ, sổ lỗi, lịch sử và bản nháp sẽ bị xóa. Nên xuất bản sao nếu anh cần giữ lại.',()=>{const theme=db.prefs.theme;db=defaultDB();db.prefs.theme=theme;save();render();toast('Đã bắt đầu lại tiến độ ôn.')},'Xóa tiến độ'),
 'dialog-close':()=>{$('#dialog').close();confirmCallback=null},'dialog-confirm':()=>{const fn=confirmCallback;$('#dialog').close();confirmCallback=null;fn?.()}
};
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b&&!b.disabled)actions[b.dataset.action]?.(b)});
document.addEventListener('input',e=>{const x=e.target;if(x.dataset.cloze){const c=x.dataset.cloze==='exam'?db.exam?.reading:S.reading.cloze;if(c){c.answers[x.dataset.index]=x.value;x.classList.remove('good','bad');if(x.dataset.cloze==='exam'){save();const a=$('#examAnswered');if(a)a.textContent=examFilled(db.exam)+'/'+(11+db.exam.reading.blanks.length)+' mục đã điền'}}return}if(x.id==='quizTyped')S.quiz.selected=x.value;if(x.id==='readingRecall'){db.drafts['r-'+S.reading.scope]=x.value;save()}if(x.id==='writingFull'){db.drafts[writingDraftKey()]=x.value;save();$('#writingWordCount').textContent=words(x.value).length+' từ'}if(x.id==='examWriting'&&db.exam&&!db.exam.submitted){db.exam.writing=x.value;save();$('#examAnswered').textContent=examFilled(db.exam)+'/'+(11+db.exam.reading.blanks.length)+' mục đã điền'}});
document.addEventListener('change',e=>{const x=e.target;if(x.id==='planSelect'){db.prefs.plan=Number(x.value);save();render()}if(x.id==='reverseQuiz'){S.quiz.reverse=x.checked;newQuiz();render()}if(x.id==='readingScope'){S.reading.scope=x.value;resetCloze();render()}if(x.id==='readingLevel'){S.reading.level=Number(x.value);resetCloze();render()}if(x.id==='recallScope'){S.reading.scope=x.value;prepareRecall();render()}if(x.id==='writingSource'){S.writing.source=x.value;S.writing.line=0;prepareLine();render()}if(x.id==='writingLine'){S.writing.line=Number(x.value);prepareLine();render()}if(x.dataset.examQuestion!==undefined&&db.exam&&!db.exam.submitted){db.exam.answers[x.dataset.examQuestion]=Number(x.value);save();$('#examAnswered').textContent=examFilled(db.exam)+'/'+(11+db.exam.reading.blanks.length)+' mục đã điền'}});
document.addEventListener('toggle',e=>{if(e.target.tagName==='DETAILS'&&e.target.open){if(e.target.querySelector('#clozeSource')&&S.reading.cloze)S.reading.cloze.assisted=true;if(e.target.querySelector('.dictionary-item')&&!S.quiz.checked)S.quiz.assisted=true}},true);
document.addEventListener('keydown',e=>{if($('#dialog').open)return;const editable=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);if(editable){if(e.key==='Enter'&&e.target.id==='quizTyped'){e.preventDefault();if(S.quiz.checked)nextQuiz();else actions['quiz-type']()}return}if(S.route==='quiz'&&S.quiz.mode!=='cards'&&!S.quiz.done){if(e.key==='Enter'&&S.quiz.checked){e.preventDefault();nextQuiz()}if(/^[1-4]$/.test(e.key)&&S.quiz.mode==='choice'&&!S.quiz.checked){e.preventDefault();const q=S.quiz.list[S.quiz.index];if(q)answerQuiz(q.options[Number(e.key)-1])}}});
$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2e6)throw Error('Bản sao quá lớn.');const raw=JSON.parse(await file.text()),x=raw.data;if(raw.app!=='IT English Sprint'||x?.version!==2||!x.items||!x.drafts||!Array.isArray(x.sessions))throw Error('Không phải bản sao tiến độ của English Sprint.');if(Object.values(x.drafts).some(v=>typeof v!=='string'||v.length>20000))throw Error('Bản nháp không hợp lệ.');if(Object.values(x.items).some(v=>typeof v.attempts!=='number'||typeof v.correct!=='number'||typeof v.streak!=='number'))throw Error('Tiến độ không hợp lệ.');const safe=defaultDB();safe.items=x.items;safe.drafts=x.drafts;safe.sessions=x.sessions.slice(0,60).filter(s=>typeof s.label==='string'&&Number.isFinite(s.time)&&Number.isFinite(s.correct)&&Number.isFinite(s.total));safe.daily={};for(const [day,n] of Object.entries(x.daily||{}))if(/^\d{4}-\d{2}-\d{2}$/.test(day)&&Number.isFinite(n)&&n>=0)safe.daily[day]=n;safe.mistakes={};for(const [k,v]of Object.entries(x.mistakes||{}))if(typeof v.question==='string'&&typeof v.answer==='string'&&['quiz','reading','writing'].includes(v.kind))safe.mistakes[k]=v;safe.prefs={...db.prefs,plan:[30,60,90].includes(x.prefs?.plan)?x.prefs.plan:60};confirmAction('Nhập bản sao tiến độ?','Tiến độ và bài viết hiện tại sẽ được thay bằng bản sao đã chọn. Lượt thi đang làm sẽ được kết thúc.',()=>{db=safe;save();render();toast('Đã nhập tiến độ và bài viết nháp.');},'Nhập bản sao')}catch(err){toast(err.message||'Không đọc được bản sao.')}finally{e.target.value=''}});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(routes.some(r=>r[0]===id)){S.route=id;render()}});
newQuiz();const requested=location.hash.slice(1);if(routes.some(r=>r[0]===requested))S.route=requested;render();if(db.exam&&!db.exam.submitted)updateExamClock();setInterval(tick,1000);
})();
</script>
</body></html>
